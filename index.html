<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Lineup">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="styles.css">
<title>Coach Lineup</title>
</head>
<body>
<div id="auth" class="screen">
  <div class="auth-card">
    <div class="logo">🏈 <b>COACH <span>LINEUP</span></b></div>
    <h1 id="authTitle">Sign in</h1>
    <p class="muted">Shared football lineups, game-day substitutions and playing-time tracking.</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="primary" id="authBtn">Sign in</button>
    <button class="link" id="toggleAuth">Create an account</button>
    <p id="authMsg" class="msg"></p>
  </div>
</div>

<div id="dashboard" class="hidden dashScreen">
  <div class="dashTop">
    <div class="dashBrand">🏈 <b>COACH <span>LINEUP</span></b><span id="syncStatus" class="syncStatus">● LIVE</span></div>
    <button class="secondary" id="dashLogout">SIGN OUT</button>
  </div>
  <div class="dashWrap">
    <div class="teamHero">
      <div>
        <div class="eyebrow">TEAM DASHBOARD</div>
        <h1 id="dashTeamName">Your Team</h1>
        <div id="dashTeamRole" class="muted"></div>
      </div>
      <div class="teamBadge">🏈</div>
    </div>

    <button id="gameDayCard" class="dashCard gameDay">
      <div class="dashIcon">🏟️</div>
      <div><b id="gameDayTitle">GAME DAY</b><small id="gameDaySub">Start a new game or resume an active game</small></div>
      <span>›</span>
    </button>

    <div class="dashGrid">
      <button id="rosterCard" class="dashCard"><div class="dashIcon">👥</div><div><b>ROSTER</b><small>Add and edit players & jersey numbers</small></div><span>›</span></button>
      <button id="linesCard" class="dashCard"><div class="dashIcon">🔄</div><div><b>LINES</b><small>Build, rename and color-code lineups</small></div><span>›</span></button>
      <button id="templatesCard" class="dashCard"><div class="dashIcon">💾</div><div><b>SAVED LINEUPS</b><small>Save, reuse or duplicate a game lineup</small></div><span>›</span></button>
      <button id="positionsCard" class="dashCard"><div class="dashIcon">🏷️</div><div><b>POSITIONS</b><small>Edit labels used on the field</small></div><span>›</span></button>
      <button id="playbookCard" class="dashCard"><div class="dashIcon">📘</div><div><b>PLAYBOOK</b><small>Running, passing & special plays • PDF</small></div><span>›</span></button>
      <button id="gameHistoryCard" class="dashCard"><div class="dashIcon">📊</div><div><b>GAME HISTORY</b><small>Past games, play totals & reports</small></div><span>›</span></button>
      <button id="installCard" class="dashCard"><div class="dashIcon">📲</div><div><b>INSTALL APP</b><small>Add Coach Lineup to your home screen</small></div><span>›</span></button>
      <button id="settingsCard" class="dashCard"><div class="dashIcon">⚙️</div><div><b>TEAM SETTINGS</b><small>Invite code and team information</small></div><span>›</span></button>
    </div>
    <div class="dashHint">Designed for sideline use • Rotate your phone for the largest Game Day field.</div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <button class="iconBtn homeBtn" id="homeBtn">⌂ HOME</button>
    <div class="brand">🏈 COACH <span>LINEUP</span></div>
    <select id="lineSelect"></select>
    <div class="spacer"></div>
    <button class="toggle active" id="namesBtn">NAMES</button><button class="toggle" id="numbersBtn">NUMBERS</button>
    <button class="iconBtn" id="teamBtn">TEAM</button>
  </header>
  <div class="fullscreenControls">
    <div id="fullscreenLineBadge" class="fullscreenLineBadge">RED LINE</div>
    <button class="secondary" onclick="setFieldFullscreen(false)">EXIT FULL SCREEN</button>
    <button class="toggle" onclick="displayMode='names';renderField()">NAMES</button>
    <button class="toggle" onclick="displayMode='numbers';renderField()">NUMBERS</button>
    <button class="primary" onclick="nextPlay()">NEXT PLAY</button>
  </div>
  <main class="layout">
    <aside class="sidebar">
      <div class="teamHead"><div><b id="teamName">No Team</b><small id="teamRole"></small></div><button class="iconBtn" id="logoutBtn">↪</button></div>
      <button class="primary full" id="addPlayerBtn">+ ADD PLAYER</button>
      <input id="search" class="search" placeholder="Search players...">
      <div id="players"></div>
      <button class="secondary full" id="linesBtn">MANAGE LINES</button>
      <button class="secondary full" id="positionsBtn">EDIT POSITION LABELS</button>
    </aside>
    <section class="main">
      <div class="toolbar gameToolbar">
        <b>PLAY #<span id="playNo">0</span></b>
        <div class="viewTabs">
          <button class="viewTab active" id="offenseTab">OFFENSE</button>
          <button class="viewTab" id="defenseTab">DEFENSE</button>
          <button class="viewTab" id="specialTab">SPECIAL TEAMS</button>
        </div>
        <select id="specialUnitSelect" class="hidden specialUnitSelect"></select>
        <button class="editFieldBtn" id="editFieldBtn">EDIT FIELD</button>
        <span class="spacer"></span><span id="warning"></span>
      </div>
      <div class="gameStrip" id="gameStrip">
        <button id="quarterDisplay" class="quarterDisplay" title="Set quarter">Q1</button>
        <button id="clockDisplay" class="clockDisplay" title="Set game clock">8:00</button>
        <button id="clockToggleBtn" class="clockToggleBtn">▶ START</button>
        <button id="possessionDisplay" class="possessionDisplay ours">OUR BALL</button>
      </div>
      <div class="fieldArea"><div id="field" class="field"><div class="mid"></div><div class="tag offense">OFFENSE</div><div class="tag defense">DEFENSE</div></div></div>
      <div class="bottom">
        <button class="chip undoPlayBtn" id="prevBtn">↶ UNDO PLAY</button>
        <div id="lineChips"></div>
        <button class="chip" id="nextBtn">NEXT ›</button>
        <span class="statsSummary" id="summary"></span>
      </div>
    </section>
    <aside class="actions">
      <button class="next" id="nextSide">NEXT PLAY</button>
      <button id="subBtn">SUBSTITUTE</button>
      <button id="statsBtn">STATS</button>
      <button id="gameBtn">GAME</button>
      <button id="playbookBtn">PLAYBOOK</button>
      <button id="recommendBtn">★ RECOMMEND LINE</button>
      <button id="historyBtn">HISTORY</button>
      <button id="lockBtn">🔓 LOCK GAME</button>
      <button id="sidelineBtn">SIDELINE MODE</button>
      <button id="resetFieldBtn">RESET FIELD</button>
      <button id="fullscreenBtn">FULL SCREEN</button>
    </aside>
  </main>
</div>

<div id="modal" class="modalWrap hidden"><div class="modal" id="modalBody"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
